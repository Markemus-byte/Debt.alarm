name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run prototype tests
        working-directory: prototype
        run: python -m unittest -v
